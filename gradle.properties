# Кодировка. Java читает файл со списком classpath, который Gradle передаёт
# тестовому процессу, в системной кодировке Windows, а не в UTF-8. Путь проекта
# содержит кириллицу (…\проекты\MewCalc), поэтому при UTF-8 тестовый процесс
# получает испорченный путь и не находит собственные классы. Отсюда windows-1251:
# исходники всё равно читаются компилятором как UTF-8.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=windows-1251

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Путь к проекту содержит кириллицу. Нативного кода в проекте нет вообще,
# проверка AGP нужна только для NDK/CMake — отключаем её.
android.overridePathCheck=true

kotlin.code.style=official

# Ключ приложения AppMetrica. Пусто — аналитика выключена.
appmetricaApiKey=3a219a0b-d8a0-4ee1-b658-b364262f417e

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
